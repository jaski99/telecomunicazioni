<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Quiz — Fondamenti di Telecomunicazioni</title>
  <style>
    *{box-sizing:border-box}:root{font-family:system-ui,sans-serif;color:#102a43;background:#f4f7fb}body{margin:0;padding:1rem}main{max-width:48rem;margin:2rem auto;background:#fff;padding:clamp(1rem,4vw,2rem);border-radius:1rem;box-shadow:0 8px 30px #102a4318}h1{font-size:clamp(1.4rem,4vw,2rem)}button,input{font:inherit}button{border:0;border-radius:.5rem;padding:.7rem 1rem;margin:.25rem;background:#075985;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.quiz-option{display:flex;gap:.75rem;padding:.7rem;border:1px solid #cbd5e1;border-radius:.5rem;margin:.5rem 0}.quiz-status{color:#334e68}.quiz-form input[type=text]{width:min(12rem,45vw);padding:.5rem;margin:.25rem}.quiz-feedback{padding:.5rem 0}.quiz-controls{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}.quiz-controls label{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}input[type=number]{width:5rem}.quiz-form input[type=text]{max-width:100%}@media(max-width:420px){body{padding:.5rem}main{margin:.5rem auto}.quiz-option{align-items:flex-start}}
  </style>
</head>
<body>
<main>
  <h1>Quiz di Fondamenti di Telecomunicazioni</h1>
  <p>Demo autonoma del modulo. I dati mostrati sono un piccolo campione didattico, senza punteggio ufficiale.</p>
  <div id="quiz" data-durata-minuti="20"></div>
</main>
<script type="module">
  import { montaQuiz } from './index.js';
  const quiz = {versione:1,elementi:[
    {id:'q-demo-campionamento',tipo:'scelta_multipla',area:3,nodo_id:'es-condizione-nyquist',temi:['M25'],domanda:'Quale relazione di frequenza compare nella periodizzazione da campionamento?',spiegazione:'Il campionamento produce repliche distanziate di ωs=2π/T. La relazione vale per campionamento ideale.',opzioni:[{id:'a',testo:'ωs=2π/T'},{id:'b',testo:'ωs=T/2π',perche_sbagliata:'La spaziatura delle repliche usa il reciproco di T con il fattore 2π.'},{id:'c',testo:'ωs=πT',perche_sbagliata:'πT non ha unità di pulsazione e non è la frequenza angolare di campionamento.'}],corretta:'a'},
    {id:'q-demo-pm-fm',tipo:'scelta_multipla',area:5,nodo_id:'modulazioni-angolo-pm-fm',temi:['M32'],domanda:'Quale elemento si antepone a un modulatore PM per ottenere FM?',spiegazione:'Si antepone un integratore al messaggio, coerentemente con la definizione di modulazione di frequenza.',opzioni:[{id:'a',testo:'Un derivatore',perche_sbagliata:'Il derivatore è la pre-rete per FM→PM; qui si chiede PM→FM.'},{id:'b',testo:'Un integratore'},{id:'c',testo:'Nessuna rete',perche_sbagliata:'Senza integratore il modulatore PM lascia la fase proporzionale al messaggio.'}],corretta:'b'},
    {id:'q-demo-ami',tipo:'completamento_formula',area:3,nodo_id:'es-pam-ami',temi:['P28'],domanda:'Completa il controllo del derivatore.',spiegazione:'Il modulo quadro della risposta del derivatore è ω²; lo spettro d’uscita moltiplica quello d’ingresso per tale fattore.',testo_con_buchi:'Per H(jω)=jω, |H(jω)|²=___1___.',soluzioni:{'1':['ω²','omega^2','omega al quadrato']}}
  ]};
  montaQuiz(document.querySelector('#quiz'),{quiz,graph:{nodi:[]},storage:window.localStorage,renderMath:()=>{},naviga:()=>{}});
</script>
</body>
</html>
